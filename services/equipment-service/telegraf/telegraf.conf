[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 500
  metric_buffer_limit = 10000
  collection_jitter = "500ms"
  flush_interval = "5s"
  flush_jitter = "500ms"
  # precision left unset (default)

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["factory/refinery/sensor"]
  qos = 0
  connection_timeout = "30s"
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  data_format = "json"
  json_string_fields = ["device_id"]

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "influx-token"
  organization = "dcs"
  bucket = "refinery"
  timeout = "5s"
  # health_check_interval removed for compatibility
