version: '3.8'

services:
  # Level 0: FIELD SENSORS (Scale 1000s)
  opcua-field:
    image: mcr.microsoft.com/iotedge/opc-plc:latest
    container_name: opcua-refinery-field
    ports:
      - "4840:4840"
    command: --pn=4840 --autoaccept --sph --sn=20 --sr=2 --st=double --fn=20 --fr=0.5 --ft=double --ctb --scn --lid --lsn --ref --gn=10
    networks:
      - field-net
    restart: unless-stopped

  # Level 1: DATA PIPELINE (OPC UA → Kafka → ML)
  node-red:
    image: nodered/node-red:latest
    container_name: dcs-edge-pipeline
    ports:
      - "1880:1880"
    volumes:
      - node-red-data:/data
    networks:
      - field-net
      - dcs-net
    restart: unless-stopped

  # Level 2: ML PREDICTIVE MAINTENANCE
  ml-server:
    image: python:3.11-slim
    container_name: refinery-ml-engine
    ports:
      - "5000:5000"
    volumes:
      - ./ml-models:/app
    working_dir: /app
    command: bash -c "pip install fastapi uvicorn scikit-learn pandas numpy && uvicorn main:app --host 0.0.0.0 --port 5000 --reload"
    networks:
      - dcs-net
    restart: unless-stopped

  # Level 2: DCS ANALYTICS (Grafana)
  grafana:
    image: grafana/grafana:10.2.0
    container_name: dcs-analytics
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=refinery123
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - dcs-net
    restart: unless-stopped

  # Level 2: INFLUXDB (Time Series Historian)
  influxdb:
    image: influxdb:2.7
    container_name: dcs-historian
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=historian123
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=influx-token
      - DOCKER_INFLUXDB_INIT_ORG=dcs
      - DOCKER_INFLUXDB_INIT_BUCKET=refinery
    volumes:
      - influx-data:/var/lib/influxdb2
    networks:
      - dcs-net

  # Telegraf: subscribe to MQTT and write to InfluxDB
  telegraf:
    image: telegraf:1.27
    container_name: dcs-telegraf
    depends_on:
      - mosquitto
      - influxdb
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    env_file:
      - ./mosquitto/.env
    networks:
      - dcs-net
      - field-net
    restart: unless-stopped

  # MQTT BROKER (lightweight) for Edge publish/subscribe
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: dcs-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    env_file:
      - ./mosquitto/.env
    networks:
      - field-net
      - dcs-net
    restart: unless-stopped

  # Sensor simulator publishes MQTT telemetry to mosquitto
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: dcs-simulator
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - PUBLISH_INTERVAL=1
    env_file:
      - ./mosquitto/.env
    depends_on:
      - mosquitto
    networks:
      - field-net
      - dcs-net
    restart: unless-stopped

  # Level 3: OEE CALCULATION ENGINE
  oee-service:
    image: node:20-alpine
    container_name: refinery-oee
    ports:
      - "9000:9000"
    volumes:
      - ./oee-service:/app
    working_dir: /app
    networks:
      - dcs-net
      - mes-net
    restart: unless-stopped
    command: sh -c "npm install && node index.js"

  # Level 3: KAFKA EVENT BACKBONE
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: dcs-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - dcs-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dcs-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - dcs-net

  # Level 4: YOUR ENTERPRISE API
  api:
    build:
      context: ./EquipmentService
      dockerfile: Dockerfile
    container_name: equipment-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=equipmentdb;Username=equipmentuser;Password=equipment123
    ports:
      - "8080:80"
    networks:
      - equipment-network
      - dcs-net
      - mes-net
    restart: unless-stopped

  # Level 4: POSTGRES (Enterprise DB)
  postgres:
    image: postgres:16-alpine
    container_name: equipment-postgres
    environment:
      POSTGRES_DB: equipmentdb
      POSTGRES_USER: equipmentuser
      POSTGRES_PASSWORD: equipment123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipmentuser -d equipmentdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - equipment-network
      - dcs-net

  # volumes for Mosquitto

volumes:
  postgres-data:
  grafana-data:
  influx-data:
  node-red-data:
  mosquitto-config:
  mosquitto-data:
  mosquitto-log:

networks:
  field-net:
    driver: bridge
  dcs-net:
    driver: bridge
  mes-net:
    driver: bridge
  equipment-network:
    driver: bridge
