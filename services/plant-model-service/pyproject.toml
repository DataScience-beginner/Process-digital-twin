[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-bdep-plant-model"
version = "0.1.0"
description = "Canonical plant model and web viewer foundation for Digital BDEP"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
