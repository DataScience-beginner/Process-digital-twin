[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-bdep-plant-model"
version = "0.1.0"
description = "Canonical plant model and web viewer foundation for Digital BDEP"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pymupdf>=1.24,<2",
  "python-multipart>=0.0.9,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
