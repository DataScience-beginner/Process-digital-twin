name: P&ID Digitization OCR and Vision Tests

on:
  pull_request:
    branches: [feature/digital-bdep-foundation, feature/pid-digitization-mvp, feature/pid-topology-graph-m2, feature/pid-topology-m3-junction-benchmark, feature/pid-m4-client-intake-public-corpus, main]
    paths:
      - 'services/plant-model-service/**'
      - '.github/workflows/pid-digitization-vision-ci.yml'
  workflow_dispatch:

jobs:
  test-ocr-vision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/plant-model-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
      - name: Install project and optional OCR / CV dependencies
        run: python -m pip install -e '.[dev,ocr,vision]'
      - name: Test complete P&ID pipeline
        run: pytest -q tests/test_pid_digitization.py tests/test_pid_digitization_api.py tests/test_pid_full_pipeline.py tests/test_pid_topology_m2.py tests/test_pid_tee_m3.py tests/test_pid_tee_api_m3.py tests/test_pid_public_reference_m3.py tests/test_pid_client_intake.py tests/test_pid_client_intake_api.py tests/test_pid_real_gold_m5.py
      - name: Report synthetic P&ID benchmark
        run: python -m scripts.benchmark_pid_extraction --report /tmp/pid_graph_benchmark.json
      - name: Archive benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: pid-graph-benchmark
          path: /tmp/pid_graph_benchmark.json
          if-no-files-found: error

  public-dexpi-reference:
    runs-on: ubuntu-latest
    # This check exercises an external publication and can be affected by remote hosting.
    # It is supplemental, not a certification of model accuracy.
    defaults:
      run:
        working-directory: services/plant-model-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local reference tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          python -m pip install -e '.[dev,ocr,vision,reference]'
      - name: Download official DEXPI reference and attempt extraction
        id: source
        continue-on-error: true
        run: python -m scripts.benchmark_public_dexpi --out /tmp/dexpi_reference
      - name: Upload external input benchmark report
        if: steps.source.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dexpi-public-reference
          path: /tmp/dexpi_reference/dexpi_reference_report.json
          if-no-files-found: error
      - name: Signal failed external check
        if: steps.source.outcome == 'failure'
        run: echo "Official DEXPI benchmark was unavailable or invalid. Not a model regression; see prior logs."

  real-pid-client-set:
    runs-on: ubuntu-latest
    # Private research copies are downloaded into a temporary ephemeral runner.
    # Original consultant PDFs are explicitly NOT committed or archived.
    defaults:
      run:
        working-directory: services/plant-model-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF and input classifier
        run: python -m pip install -e '.[dev]'
      - name: Download real legend + P&ID drawing sets and inspect each sheet
        id: collect
        continue-on-error: true
        run: python -m scripts.collect_public_pid_sets --out /tmp/public_client_pid_sets --save-originals --analyze-one
      - name: Client intake end-to-end test on real Pahala 25-sheet package
        if: steps.collect.outcome == 'success'
        run: |
          python -m scripts.pilot_public_client_package \
            --source /tmp/public_client_pid_sets/Pahala_WWTP_25_sheet_PIDs_with_3_legends.pdf \
            --out /tmp/public_client_pid_sets
      - name: Benchmark 10 real P&ID sheets and one OCR-enabled mixed sheet
        if: steps.collect.outcome == 'success'
        run: |
          python -m scripts.pilot_ten_real_pid_sheets \
            --source /tmp/public_client_pid_sets/Pahala_WWTP_25_sheet_PIDs_with_3_legends.pdf \
            --out /tmp/public_client_pid_sets/real_ten_sheet_analysis \
            --ocr-pages 12
          python -m scripts.evaluate_real_pid_gold \
            --gold /tmp/public_client_pid_sets/real_ten_sheet_analysis/engineer_gold_annotation_tasks.json \
            --evidence /tmp/public_client_pid_sets/real_ten_sheet_analysis/source_candidate_evidence.json \
            --out /tmp/public_client_pid_sets/real_ten_sheet_analysis/accuracy_gate.json
      - name: Upload source-cited inventory only (no copyrighted PDFs)
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: public-client-pid-sheet-inventory
          path: |
            /tmp/public_client_pid_sets/public_pid_intake_report.json
            /tmp/public_client_pid_sets/public_client_e2e_report.json
            /tmp/public_client_pid_sets/real_ten_sheet_analysis/*.json
            /tmp/public_client_pid_sets/real_ten_sheet_analysis/*.csv
          if-no-files-found: error
      - name: Report external source availability
        if: steps.collect.outcome == 'failure'
        run: echo "Official public PDF download failed; examine source availability and retry. Existing code CI remains independent."
