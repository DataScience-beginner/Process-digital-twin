name: P&ID Digitization OCR and Vision Tests

on:
  pull_request:
    branches: [feature/digital-bdep-foundation, main]
    paths:
      - 'services/plant-model-service/**'
      - '.github/workflows/pid-digitization-vision-ci.yml'
  workflow_dispatch:

jobs:
  test-ocr-vision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/plant-model-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
      - name: Install project and optional OCR / CV dependencies
        run: python -m pip install -e '.[dev,ocr,vision]'
      - name: Test complete P&ID pipeline
        run: pytest -q tests/test_pid_digitization.py tests/test_pid_digitization_api.py tests/test_pid_full_pipeline.py
